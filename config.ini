[pomodoro]
work = 25
pause = 5
pomodori = 4
num_beeps = 5
notification = ~/share/linux/patata/notification.wav

[action:read]
prompt = true
aliases = pataread

[action:planning]
prompt = false
aliases = plan, pataplan

[action:mail]
prompt = false
aliases = patamail

[action:meeting]
prompt = true
aliases = patameeting

[action:test]
prompt = true
