[pomodoro]
work = 25
pause = 5
pomodori = 4
num_beeps = 5
notification = ~/share/linux/patata/notification.wav

[menu]
command = dmenu -i -p {prompt}

[action:read]
prompt = true

[action:planning]
prompt = false
aliases = plan

[action:mail]
prompt = false

[action:meeting]
prompt = true

[action:test]
prompt = true
